name: Dashboard Forecast Refresh

on:
  schedule:
    - cron: "7,22,37,52 2-8 * * 1-5"
  push:
    branches:
      - main
      - master
    paths:
      - "dashboard/**"
      - "tools/**"
      - "backtest/**"
      - "output/**"
      - "update_dashboard_live_data.py"
      - "generate_dashboard_data.py"
      - "generate_deep_analysis.py"
      - "generate_model_history.py"
  workflow_dispatch:

concurrency:
  group: ez-dashboard-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'ez-trading' }}
      VERCEL_PUBLIC_URL: ${{ vars.VERCEL_PUBLIC_URL || 'https://ez-trading.vercel.app' }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow fastparquet requests beautifulsoup4 lxml html5lib vnstock

      - name: Preserve current public forecast state
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = os.environ["VERCEL_PUBLIC_URL"].rstrip("/")
          for name in ["r46_forecast.json", "r46_execution_state.json", "full_universe_live_update_status.json"]:
              url = f"{base}/{name}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      raw = resp.read()
                  if raw:
                      (Path("dashboard") / name).write_bytes(raw)
                      Path("output").mkdir(exist_ok=True)
                      if name == "r46_forecast.json":
                          Path("output/r46_forecast_status.json").write_bytes(raw)
                      elif name == "r46_execution_state.json":
                          Path("output/r46_execution_state.json").write_bytes(raw)
                      elif name == "full_universe_live_update_status.json":
                          Path("output/full_universe_live_update_status.json").write_bytes(raw)
                      print(f"Preserved public {name}")
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                  print(f"Could not preserve {name}: {exc}")
          PY

      - name: Update live data
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in 1 2 3; do
            if python update_dashboard_live_data.py; then
              exit 0
            fi
            echo "Live data update failed on attempt ${attempt}/3"
            if [ "$attempt" != "3" ]; then
              sleep 45
            fi
          done
          echo "LIVE_DATA_REFRESH_FAILED=1" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = os.environ["VERCEL_PUBLIC_URL"].rstrip("/")
          url = f"{base}/dashboard_live_update_status.json"
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  raw = resp.read()
              if raw:
                  Path("dashboard/dashboard_live_update_status.json").write_bytes(raw)
                  Path("output").mkdir(exist_ok=True)
                  Path("output/dashboard_live_update_status.json").write_bytes(raw)
                  print("Preserved public dashboard_live_update_status.json after GitHub VPS failure")
                  raise SystemExit(0)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
              print(f"Could not preserve public live status: {exc}")
          raise SystemExit("Live data refresh failed and no public fallback was available")
          PY

      - name: Update full-universe prices
        working-directory: ${{ github.workspace }}
        run: |
          timeout 720s python tools/update_full_universe_prices.py --workers 10 --retry-stale-passes 2 --retry-workers 4 --min-fresh-pct 0.65 || {
            echo "FULL_UNIVERSE_REFRESH_FAILED=1" >> "$GITHUB_ENV"
            echo "Full-universe refresh failed; preserving the last public forecast/full-universe state and blocking deploy if it is not current."
          }

      - name: Use public fallback when live refresh failed
        if: env.LIVE_DATA_REFRESH_FAILED == '1'
        working-directory: ${{ github.workspace }}
        run: |
          python tools/check_dashboard_public_health.py --require-fresh-live --require-edge-live --require-vni-history --require-current-vni --require-current-forecast --require-execution-desk
          echo "SKIP_DASHBOARD_DEPLOY=1" >> "$GITHUB_ENV"
          echo "Live source was unavailable from GitHub; public dashboard/edge data is fresh, so this run will not rebuild from partial checkout data."

      - name: Regenerate dashboard analysis
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        working-directory: ${{ github.workspace }}
        run: python generate_deep_analysis.py

      - name: Regenerate model history
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        working-directory: ${{ github.workspace }}
        run: python generate_model_history.py

      - name: Regenerate dashboard data
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f generate_dashboard_data.py ]; then
            python generate_dashboard_data.py
          else
            echo "generate_dashboard_data.py not present in this repo checkout; keeping existing dashboard/data.js"
          fi

      - name: Precompute R46 forecast
        if: env.SKIP_DASHBOARD_DEPLOY != '1' && env.FULL_UNIVERSE_REFRESH_FAILED != '1'
        working-directory: ${{ github.workspace }}
        run: python tools/precompute_r46_forecast.py

      - name: Keep preserved forecast after full-universe failure
        if: env.SKIP_DASHBOARD_DEPLOY != '1' && env.FULL_UNIVERSE_REFRESH_FAILED == '1'
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dashboard/r46_forecast.json").read_text(encoding="utf-8-sig"))
          print(f"Skipped R46 recompute because full-universe refresh failed; preserved status={payload.get('status')} asOf={payload.get('asOf')} planDate={payload.get('planDate')}")
          PY

      - name: Verify R46 forecast precompute
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dashboard/r46_forecast.json").read_text(encoding="utf-8-sig"))
          meta = payload.get("meta") or {}
          # Dynamic staleness anchor: forecast asOf phải bắt kịp dữ liệu fresh nhất mà
          # full-universe refresh vừa kéo về (không hard-code ngày). Nếu chậm hơn -> stale.
          fresh_floor = ""
          for status_path in ("output/full_universe_live_update_status.json", "dashboard/full_universe_live_update_status.json"):
              p = Path(status_path)
              if p.exists():
                  try:
                      fu = json.loads(p.read_text(encoding="utf-8-sig"))
                  except Exception:
                      continue
                  fresh_floor = str(fu.get("latestPriceDate") or fu.get("targetDate") or "")
                  if fresh_floor:
                      break
          if payload.get("status") == "COMPUTED":
              bad = [k for k in meta if k.startswith("cloudR46Refresh") or k.startswith("cloudFullUniverseRefresh")]
              if bad:
                  raise SystemExit(f"fresh R46 forecast has fallback diagnostics: {bad}")
              as_of = str(payload.get("asOf") or "")
              if fresh_floor and as_of < fresh_floor:
                  raise SystemExit(f"R46 forecast asOf {as_of} is stale vs full-universe latest {fresh_floor}")
              print(f"R46 forecast computed cleanly: asOf={as_of} planDate={payload.get('planDate')} freshFloor={fresh_floor} rows={len(payload.get('rows') or [])}")
          else:
              raise SystemExit(f"R46 forecast is not computed; refusing to deploy: status={payload.get('status')} reason={payload.get('reason')}")
          PY

      - name: Preflight dashboard history
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          history = Path("dashboard/history.js").read_text(encoding="utf-8", errors="replace")
          count = len(re.findall(r'"vniClose"\s*:\s*[0-9]', history))
          if count <= 0:
              raise SystemExit("dashboard/history.js has no numeric VN-Index points; refusing to deploy broken chart")
          print(f"dashboard/history.js VN-Index points: {count}")
          PY

      - name: Build v7 static dashboard
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        working-directory: ${{ github.workspace }}
        run: python dashboard/_preview/build_v7_real.py --out dashboard/index.html

      - name: Deploy dashboard to Vercel
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        run: python tools/deploy_vercel_dashboard.py --dashboard-dir dashboard --target production --wait

      - name: Verify public dashboard freshness
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          base = os.environ["VERCEL_PUBLIC_URL"].rstrip("/")
          last_error = None
          for attempt in range(1, 13):
              url = f"{base}/dashboard_live_update_status.json?v={int(time.time())}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  updated_at = str(payload.get("updatedAt") or "")
                  if updated_at.startswith(time.strftime("%Y-%m-%d")):
                      history_url = f"{base}/history.js?v={int(time.time())}"
                      with urllib.request.urlopen(history_url, timeout=30) as hist_resp:
                          history = hist_resp.read().decode("utf-8", errors="replace")
                      if '"vniClose": ' not in history or '"vniClose": null' == history.split('"vniClose": ', 1)[1].split("\n", 1)[0].strip().rstrip(","):
                          import re
                          if not re.search(r'"vniClose"\s*:\s*[0-9]', history):
                              last_error = "history.js has no numeric VN-Index points"
                              raise RuntimeError(last_error)
                      print(f"Public dashboard fresh: {updated_at}")
                      sys.exit(0)
                  last_error = f"stale updatedAt={updated_at}"
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, json.JSONDecodeError, RuntimeError) as exc:
                  last_error = repr(exc)
              print(f"Waiting for Vercel alias propagation attempt {attempt}/12: {last_error}")
              time.sleep(10)
          print(f"Public dashboard freshness check failed after retries: {last_error}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Verify public dashboard assets
        if: env.SKIP_DASHBOARD_DEPLOY != '1'
        working-directory: ${{ github.workspace }}
        run: python tools/check_dashboard_public_health.py --require-fresh-live --require-edge-live --require-vni-history --require-current-vni --require-current-forecast --require-execution-desk
